<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Flag Party — the flag-guessing party game</title>
  <meta name="description" content="Guess the country from a half-revealed flag. Phones in, first correct guess wins. No app, no accounts." />
  <meta name="theme-color" content="#0E0E12" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Flag Party" />
  <meta property="og:title" content="Flag Party — the flag-guessing party game" />
  <meta property="og:description" content="Guess the country from a half-revealed flag. Phones in, first guess wins." />
  <meta property="og:url" content="https://flagparty.social/" />
  <meta property="og:image" content="https://flagparty.social/assets/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://flagparty.social/assets/og-image.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="landing">
  <main class="wrap landing-hero">
    <h1 class="brand"><a href="index.html"><span class="accent">Flag</span> Party</a></h1>
    <p class="tagline">A flag sharpens tile by tile. First to ring the right
      country wins — earlier is worth more.</p>

    <!-- Daily solo lane first: the instant hook, no party needed. -->
    <a id="btnDaily" class="ld-daily" href="daily.html">
      <span class="art" aria-hidden="true">🚩</span>
      <span><strong>Play today's Daily</strong> — five flags, the same for
        everyone today. No party needed.
        <span id="ldDailyStreak" class="ld-daily-streak hidden"></span>
      </span>
    </a>

    <!-- Above the fold: one primary, one join. -->
    <div id="ld-cta" class="ld-panel">
      <a id="btnStart" class="btn-primary ld-cta-main" href="player.html?create=1">Start a party</a>
      <button id="btnHaveCode" class="ld-cta-sub" type="button">Have a code? Join</button>
    </div>

    <!-- One join path. -->
    <div id="ld-join" class="ld-panel hidden">
      <div class="join-row">
        <input id="ldCode" maxlength="6" placeholder="CODE" autocomplete="off"
               autocapitalize="characters" spellcheck="false" class="code-input" />
        <button id="btnLdJoin" class="btn-primary" type="button">Join</button>
      </div>
      <div id="ldErr" class="join-err"></div>
      <button id="btnJoinBack" class="btn-ghost" type="button">← Back</button>
    </div>

    <footer class="ld-footer">
      <a href="screen.html">Add a TV</a>
      <span aria-hidden="true">·</span>
      <a href="howto.html">How to play</a>
      <span aria-hidden="true">·</span>
      <a href="https://github.com/earino-assistant/flag-reveal/issues">Feedback</a>
      <span aria-hidden="true">·</span>
      <button id="btnPrivacy" class="link-btn" type="button">Privacy</button>
      <span aria-hidden="true">·</span>
      <a href="https://github.com/earino-assistant/flag-reveal">GitHub</a>
    </footer>
    <p class="ld-ownership">© 2026 · A game by Eduardo Ariño de la Rubia</p>
  </main>

  <script type="module" src="js/consent.js"></script>
  <script type="module">
    import { isValidRoomCode } from "./js/roomcode.js";
    import { track, openBanner } from "./js/consent.js";
    import { dailyKey, loadDailyResult, loadLastResult } from "./js/daily.js";

    const $ = (id) => document.getElementById(id);

    // Tease a live Daily streak (and "done today ✓") on the landing CTA — a
    // scores-only badge, no room code, no team name (nothing to mask).
    try {
      const store = window.localStorage;
      const todayKey = dailyKey(new Date());
      const doneToday = loadDailyResult(store, todayKey);
      const last = loadLastResult(store);
      const badge = $("ldDailyStreak");
      if (doneToday) {
        badge.textContent = (doneToday.streak || 0) >= 2 ? `done ✓ · 🔥${doneToday.streak}` : "done ✓";
        badge.classList.remove("hidden");
      } else if (last && (last.streak || 0) >= 2) {
        badge.textContent = `🔥${last.streak}`;
        badge.classList.remove("hidden");
      }
    } catch { /* private mode — no badge */ }
    $("btnHaveCode").addEventListener("click", () => {
      $("ld-cta").classList.add("hidden");
      $("ld-join").classList.remove("hidden");
      $("ldCode").focus();
    });
    $("btnJoinBack").addEventListener("click", () => {
      $("ld-join").classList.add("hidden");
      $("ld-cta").classList.remove("hidden");
    });
    $("ldCode").addEventListener("input", (e) => {
      e.target.value = e.target.value.toUpperCase();
    });
    const go = () => {
      const c = ($("ldCode").value || "").trim().toUpperCase();
      if (!isValidRoomCode(c)) {
        $("ldErr").textContent = "Enter a 6-letter room code.";
        return;
      }
      track("front_door_join", { mode: "phone" });
      location.href = "player.html?room=" + c;
    };
    $("btnLdJoin").addEventListener("click", go);
    $("ldCode").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
    $("btnStart").addEventListener("click", () => track("front_door_create", { mode: "phone" }));
    $("btnPrivacy").addEventListener("click", openBanner);
  </script>
</body>
</html>
