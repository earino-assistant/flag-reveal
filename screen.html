<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flag Reveal — TV</title>
  <meta name="description" content="The big screen for Flag Reveal. Subscribes and renders the progressive flag reveal." />
  <meta name="theme-color" content="#0E0E12" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="tv">
  <div id="connPill" class="conn-pill hidden">Reconnecting…</div>

  <!-- ============================ JOIN ============================ -->
  <section id="s-join" class="phase-screen">
    <div class="wrap tv-join">
      <h1 class="brand"><span class="accent">Flag</span> Reveal</h1>
      <p class="tagline">Put me on the big screen.</p>
      <div class="join-row">
        <input id="sCode" maxlength="6" placeholder="CODE" autocomplete="off"
               autocapitalize="characters" spellcheck="false" class="code-input" />
        <button id="btnSConnect" class="btn-primary">Connect</button>
      </div>
      <div id="sErr" class="join-err"></div>
    </div>
  </section>

  <!-- ============================ DISPLAY ============================ -->
  <section id="s-display" class="phase-screen hidden">
    <header class="tv-head">
      <div class="tv-room">Room <strong id="tvCode" data-ph-mask>······</strong></div>
      <div id="tvHeader" class="tv-round">Lobby</div>
    </header>

    <main class="tv-main">
      <div id="tvReveal" class="reveal-holder tv-reveal"></div>
      <div id="tvAnswer" class="tv-answer hidden">—</div>
      <div id="tvResult" class="tv-result"></div>
      <div id="tvBeats" class="reveal-beats" data-ph-mask></div>
    </main>

    <aside class="tv-side">
      <h2 class="side-title">Standings</h2>
      <ul id="tvBoard" class="totals-list tv-board" data-ph-mask></ul>
      <div id="tvNote" class="waiting-note"></div>
    </aside>
  </section>

  <script type="module" src="js/consent.js"></script>
  <script type="module" src="js/screen-flag.js"></script>
</body>
</html>
