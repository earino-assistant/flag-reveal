<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flag Party — TV</title>
  <meta name="description" content="The big screen for Flag Party. Subscribes and renders the progressive flag reveal." />
  <meta name="theme-color" content="#0E0E12" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <!-- Pinned Leaflet 1.9.4 loaded at page load (classic script, GeoParty
       pattern); used decoratively at reveal. From unpkg with SRI, exactly as
       the sibling game GeoParty does —
       Leaflet/OSM tiles are runtime CDN services, not vendored content (the
       vendoring rule covers the flag SVGs, the game's core asset). -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="tv">
  <div id="connPill" class="conn-pill hidden">Reconnecting — hang tight…</div>

  <!-- ============================ JOIN ============================ -->
  <section id="s-join" class="phase-screen">
    <div class="wrap tv-join">
      <h1 class="brand"><span class="accent">Flag</span> Party</h1>
      <p class="tagline">Put me on the big screen.</p>
      <div class="join-row">
        <input id="sCode" maxlength="6" placeholder="CODE" autocomplete="off"
               autocapitalize="characters" spellcheck="false" class="code-input" />
      </div>
      <div id="sErr" class="join-err"></div>
    </div>
  </section>

  <!-- ============================ DISPLAY ============================ -->
  <section id="s-display" class="phase-screen hidden">
    <!-- Game-over celebration layers (decorative; screen-flag.js fills the
         confetti burst). Bloom sits BEHIND the content (z-index 0), confetti
         ABOVE it (z-index 2) — the GeoParty pitfall was confetti behind the
         leaderboard. Both aria-hidden: the "👑 name wins" text carries meaning. -->
    <div id="tvBloom" class="tv-bloom" aria-hidden="true"></div>
    <div id="tvConfetti" class="tv-confetti" aria-hidden="true"></div>
    <!-- Transient "guessed wrong" hint (Item 4): a passive, content-free pill the
         TV pops when a team rings in wrong mid-round, then fades (~2.5s, timed in
         screen-flag.js). The team name is masked for replay; role=status +
         aria-live announces it. It names no country — the guess is disclosed only
         at reveal (the beats below). -->
    <div id="tvWrongHint" class="tv-wrong-hint hidden" role="status" aria-live="polite"></div>
    <header class="tv-head">
      <div class="tv-room">Room <strong id="tvCode" class="skeleton" data-ph-mask>······</strong></div>
      <div id="tvHeader" class="tv-round">Lobby</div>
    </header>

    <main class="tv-main">
      <div id="tvReveal" class="reveal-holder tv-reveal"></div>
      <div id="tvJoinQr" class="tv-join-qr hidden">
        <canvas id="tvJoinQrCanvas" class="qr-canvas qr-tv" aria-hidden="true"></canvas>
        <p class="tv-join-qr-cap">Scan to join — or enter
          <span id="tvJoinCode" class="tv-join-code skeleton" data-ph-mask>······</span></p>
      </div>
      <div id="tvAnswer" class="tv-answer hidden">—</div>
      <!-- ONE breathing reveal map (Items B): a single OSM-tile canvas that
           pulses between a zoomed-out "where in the world" view and a zoomed-in
           "up close" view framed to the country's borders, swapping the caption
           per leg. Filled by js/screen-flag.js at reveal only (the answer is
           public then); js/tv-maps.js drives the pulse and tears it down on every
           other phase. Decorative — offline-after-served it may render empty. -->
      <div id="tvMaps" class="tv-maps hidden" aria-hidden="true">
        <figure class="tv-map-wrap"><div id="tvMap" class="tv-map"></div>
          <figcaption id="tvMapCaption">Where in the world?</figcaption></figure>
      </div>
      <!-- Game-over round recap (read-only fold of settled rounds): a single
           auto-cycling card in the empty band above the winner line — each
           round's answer flag + name and what every team guessed. Filled and
           cycled by js/screen-flag.js from partyHistory. The card's team-name
           spans carry data-ph-mask (inline, added in JS); the answer flag is
           decorative (aria-hidden). Hidden except at gameOver (CSS state
           machine). Passive-TV: no write, no transaction, no phase flip. -->
      <div id="tvRecap" class="tv-recap hidden" aria-live="polite"></div>
      <div id="tvResult" class="tv-result"></div>
      <div id="tvComingUp" class="tv-comingup"></div>
      <!-- Escape hatch: leave the room and return to the join screen to type a
           different code (no reload). Visible on lobby + gameOver only (CSS).
           Mirrors GeoParty's btnNewEntry → leaveRoom(): stops the heartbeat,
           drops the subscription, clears the room + URL. No game-state write. -->
      <button id="btnTvNewEntry" class="tv-newentry" type="button">← Enter a different code</button>
    </main>

    <aside class="tv-side">
      <h2 class="side-title">Standings</h2>
      <ul id="tvBoard" class="totals-list tv-board" data-ph-mask></ul>
      <div id="tvNote" class="waiting-note"></div>
    </aside>

    <!-- The wrong-guess "busts" gallery. Its own grid block so the reveal
         layout can place it below the standings, center-stage (not a
         sidebar). Hidden except during reveal/gameOver. -->
    <section id="tvBeats" class="reveal-beats tv-busts" data-ph-mask></section>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
  <script type="module" src="js/consent.js"></script>
  <script type="module" src="js/screen-flag.js"></script>
</body>
</html>
