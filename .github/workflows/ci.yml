# CI — the PR gate. Runs tests + syntax check on every push. This is the
# untouched gate; pages.yml does the deploy.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check all modules
        run: npm run check
      - name: Run tests
        run: npm test
